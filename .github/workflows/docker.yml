name: Docker image

# Builds the image with `encore build docker` (see scripts/build.sh and the
# README's "Building for deployment" section for why there's no Dockerfile).
# PRs only build, to make sure nothing broke -- nothing is pushed except on
# a version tag or a push to dev, and forked-repo PRs never see registry
# credentials. A version tag publishes :sha-*, :vX.Y.Z and :latest, plus a
# GitHub release; dev publishes only a floating :dev, for testing an
# unreleased build without cutting a real version.

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Encore CLI
        run: |
          curl -fsSL https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      # Bakes the tag being built into the image itself (frontend/indexHtml.ts
      # displays shared/version.ts's APP_VERSION) -- so the running dashboard
      # can always show which version it actually is, with nothing for a
      # deployer to configure or keep in sync. dev-<sha> for anything that
      # isn't a version tag: PR validation builds (never pushed anywhere,
      # so the exact value is moot) and the floating :dev image, where
      # showing the real sha in the header is the point -- :dev itself
      # never changes, so this is the only way to tell which commit it is.
      - name: Resolve app version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="dev-${GITHUB_SHA::12}"
          fi
          sed -i "s/APP_VERSION = \".*\"/APP_VERSION = \"$version\"/" shared/version.ts

      - name: Build image
        run: encore build docker "${{ steps.image.outputs.name }}:ci"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"

          docker tag "$image:ci" "$image:sha-${GITHUB_SHA::12}"
          docker push "$image:sha-${GITHUB_SHA::12}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            docker tag "$image:ci" "$image:$version"
            docker push "$image:$version"

            docker tag "$image:ci" "$image:latest"
            docker push "$image:latest"
          elif [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            docker tag "$image:ci" "$image:dev"
            docker push "$image:dev"
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          image="${{ steps.image.outputs.name }}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          pkg_url="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${repo_name,,}"

          notes="Docker image:

              docker pull $image:$version

          Package: $pkg_url"

          gh release create "$version" \
            --title "$version" \
            --generate-notes \
            --notes "$notes"
